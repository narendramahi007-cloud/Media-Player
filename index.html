<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Mahi-Media_Pro</title>
  <style>
    :root {
      --bg-color: #ffb6c1;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.65);
      --primary: #d81b60;
      --text-dark: #222;
      --shadow: 0 8px 32px 0 rgba(216, 27, 96, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color); width: 100vw; height: 100vh; overflow: hidden;
      color: var(--text-dark); overscroll-behavior-y: none; touch-action: pan-x pan-y;
    }

    .watermark-bg {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: url('my-photos.jpg');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      opacity: 0.15; pointer-events: none; z-index: 1;
    }

    .screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      display: none; flex-direction: column; z-index: 10; animation: fadeIn 0.2s ease-in-out;
    }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* FRONT UI TOP BAR */
    .home-top-bar {
      position: absolute; top: 0; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; padding: 15px 20px; z-index: 20;
    }
    .app-title { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-shadow: 2px 2px 4px rgba(255,255,255,0.9); }
    
    .scan-controls {
      display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center;
      width: 100%; max-width: 400px;
    }
    .scan-btn {
      background: var(--text-dark); color: white;
      padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; 
      cursor: pointer; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      flex: 1; min-width: 100px;
    }
    .scan-btn.primary { background: var(--primary); }
    .scan-btn.camera-btn { background: #1565c0; }
    .scan-status { margin-top: 6px; font-size: 0.75rem; color: #444; font-weight: bold; text-align: center; }

    /* HOME LAYOUT */
    .home-layout {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 90%; max-width: 400px; z-index: 10;
    }
    .main-btn {
      width: 45%; padding: 15px 10px; border-radius: 15px; text-align: center;
      background: var(--glass-bg); border: 2px solid var(--glass-border);
      backdrop-filter: blur(12px); box-shadow: var(--shadow); font-size: 1rem; font-weight: bold; color: var(--text-dark);
      display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s;
    }
    .main-btn:active { transform: scale(0.95); background: var(--primary); color: white; }
    .main-btn .icon { font-size: 1.5rem; }

    /* HEADER */
    .app-header {
      padding: 12px 18px; background: var(--glass-bg); border-bottom: 2px solid var(--glass-border);
      display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); z-index: 15;
    }
    .back-btn { background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* GRID VIEWS */
    .grid-container {
      flex: 1; overflow-y: auto; padding: 20px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px;
      align-content: flex-start;
    }
    .grid-item {
      background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 15px;
      padding: 15px 10px; text-align: center; position: relative; cursor: pointer; backdrop-filter: blur(5px);
    }
    .grid-item .icon { font-size: 2.5rem; display: block; margin-bottom: 8px; }
    .grid-item .name {
      font-size: 0.8rem; font-weight: 600; white-space: normal; word-wrap: break-word;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    .item-menu-btn {
      position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.1); border: none;
      border-radius: 50%; width: 25px; height: 25px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
      display: flex; justify-content: center; align-items: center; color: var(--text-dark);
    }
    .item-menu-btn:active { background: var(--primary); color: white; }

    /* FULLSCREEN PLAYER */
    #player-screen { background: #000; z-index: 999; }
    .player-header {
      position: absolute; top: 0; left: 0; width: 100%; padding: 15px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); z-index: 9999; color: white; transition: opacity 0.3s;
    }
    .close-player-btn, .orient-btn { background: rgba(255,255,255,0.25); border: none; color: white; width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; }
    .now-playing-title { flex: 1; text-align: center; font-size: 1rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 10px; }

    .stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; width: 100%; height: 100%; touch-action: none;
    }
    
    video, img#photo-view { max-width: 100%; max-height: 100%; display: none; image-rendering: crisp-edges; image-rendering: -webkit-optimize-contrast; transform-origin: center center; transition: transform 0.2s ease-out; }
    iframe#pdf-view { width: 100%; height: 100%; border: none; background: white; display: none; z-index: 50; }

    .music-ui { display: none; flex-direction: column; align-items: center; color: white; }
    .music-disc {
      width: 180px; height: 180px; border-radius: 50%; background: var(--primary);
      display: flex; align-items: center; justify-content: center; font-size: 4.5rem;
      animation: spin 10s linear infinite; animation-play-state: paused; box-shadow: 0 0 30px var(--primary);
    }
    .music-disc.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .controls-bar {
      position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      padding: 20px 20px 25px 20px; display: flex; flex-direction: column; gap: 12px; z-index: 60; transition: opacity 0.3s ease;
    }
    .hud-hidden { opacity: 0 !important; pointer-events: none !important; }
    .force-visible { opacity: 1 !important; pointer-events: auto !important; }

    .slider-row { display: flex; align-items: center; gap: 12px; color: white; font-size: 0.85rem; font-weight: bold; }
    input[type="range"] { flex: 1; appearance: none; height: 5px; border-radius: 5px; background: rgba(255,255,255,0.3); outline: none; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; }
    .buttons-row { display: flex; justify-content: center; align-items: center; gap: 25px; }
    .ctrl-btn { background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; }
    .ctrl-btn.main { font-size: 3rem; color: var(--primary); }

    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7); z-index: 99999; display: none;
      justify-content: center; align-items: center; flex-direction: column;
    }
    .loading-overlay.active { display: flex; }
    .loading-spinner {
      width: 50px; height: 50px; border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text { color: white; margin-top: 15px; font-size: 1rem; }

    /* Camera Button in Home */
    .camera-btn {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(21, 101, 192, 0.4);
      transition: 0.2s;
      flex: 1;
      min-width: 120px;
    }
    .camera-btn:active { transform: scale(0.95); }

    /* Camera UI Styles */
    .camera-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .camera-container.active { display: flex; }

    #video-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .camera-overlay {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .camera-shutter {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: white;
      border: 4px solid rgba(255,255,255,0.5);
      cursor: pointer;
      transition: 0.2s;
    }
    .camera-shutter:active { transform: scale(0.85); }

    .camera-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    .camera-switch {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .filter-bar {
      position: absolute;
      top: 80px;
      left: 0;
      width: 100%;
      padding: 10px 15px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }
    .filter-chip.active {
      border-color: #d81b60;
      background: #d81b60;
    }
    .filter-chip:active { transform: scale(0.9); }

    .flash-effect {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.1s;
    }
    .flash-effect.active { opacity: 0.8; transition: opacity 0s; }

    /* Camera Toast */
    .camera-toast {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: 0.3s;
      z-index: 20;
    }
    .camera-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="watermark-bg"></div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">फाइलें लोड हो रही हैं...</div>
  </div>

  <!-- SCREEN 1: HOME -->
  <div id="home-screen" class="screen active">
    <div class="home-top-bar">
      <div class="app-title">📸 Mahi-Media_Pro</div>
      <div class="scan-controls">
        <button class="scan-btn" onclick="startScan('folder')">📁 Folder Scan</button>
        <button class="scan-btn primary" onclick="startScan('files')">📄 Select Files</button>
        <button class="camera-btn" onclick="openCamera()">📷 Camera</button>
      </div>
      <div class="scan-status" id="scan-status">📂 फोल्डर या फाइलें सेलेक्ट करें</div>
      
      <input type="file" id="folder-input" webkitdirectory multiple style="display:none;" onchange="handleScan(event, 'folder')">
      <input type="file" id="files-input" multiple accept="video/*,audio/*,image/*,.pdf" style="display:none;" onchange="handleScan(event, 'files')">
    </div>

    <div class="home-layout">
      <div class="main-btn" onclick="openCategory('video')"><span class="icon">🎬</span> Video</div>
      <div class="main-btn" onclick="openCategory('audio')"><span class="icon">🎵</span> Audio</div>
      <div class="main-btn" onclick="openCategory('image')"><span class="icon">🖼️</span> Image</div>
      <div class="main-btn" onclick="openCategory('pdf')"><span class="icon">📄</span> PDF</div>
    </div>
  </div>

  <!-- SCREEN 2: FOLDERS VIEW -->
  <div id="folders-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('home-screen')">⬅ Home</button>
      <h3 id="folder-view-title" style="color:var(--primary);">Folders</h3>
      <div></div>
    </div>
    <div class="grid-container" id="folders-grid"></div>
  </div>

  <!-- SCREEN 3: FILES VIEW -->
  <div id="files-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('folders-screen')">⬅ Folders</button>
      <h3 id="file-view-title" style="color:var(--primary);">Files</h3>
      <div></div>
    </div>
    <div class="grid-container" id="files-grid"></div>
  </div>

  <!-- SCREEN 4: FULLSCREEN PLAYER -->
  <div id="player-screen" class="screen">
    <div class="player-header" id="player-header">
      <button class="close-player-btn" onclick="closePlayer()">✖</button>
      <div class="now-playing-title" id="now-playing-title">File Name</div>
      <button class="orient-btn" onclick="toggleOrientation()">🔄</button>
    </div>

    <div class="stage" id="media-stage" onclick="toggleControlsHUD()">
      <video id="vid-player" playsinline></video>
      <img id="photo-view" src="">
      <iframe id="pdf-view"></iframe>
      <div class="music-ui" id="music-ui">
        <div class="music-disc" id="music-disc">🎵</div>
      </div>
      <audio id="aud-player"></audio>
    </div>

    <div class="controls-bar" id="controls-bar" onclick="event.stopPropagation()">
      <div class="slider-row" id="seekbar-row">
        <span id="curr-time">0:00</span>
        <input type="range" id="seek-slider" min="0" max="100" value="0" oninput="seekMedia(this.value)">
        <span id="total-time">0:00</span>
      </div>
      <div class="buttons-row">
        <button class="ctrl-btn" onclick="prevMedia()">⏮</button>
        <button class="ctrl-btn" id="skip-back-btn" onclick="skipMedia(-10)">⏪</button>
        <button class="ctrl-btn main" id="play-pause-btn" onclick="togglePlay()">⏯</button>
        <button class="ctrl-btn" id="skip-fwd-btn" onclick="skipMedia(10)">⏩</button>
        <button class="ctrl-btn" onclick="nextMedia()">⏭</button>
      </div>
    </div>
  </div>

  <!-- ===================== CAMERA UI ===================== -->
  <div class="camera-container" id="camera-container">
    <video id="video-preview" autoplay playsinline muted></video>
    <div class="flash-effect" id="flash-effect"></div>
    
    <!-- Filter Bar -->
    <div class="filter-bar" id="filter-bar"></div>

    <!-- Controls -->
    <div class="camera-overlay">
      <button class="camera-close" onclick="closeCamera()">✖ Close</button>
      <div class="camera-shutter" id="camera-shutter" onclick="capturePhoto()"></div>
      <button class="camera-switch" onclick="switchCamera()">🔄</button>
    </div>

    <div class="camera-toast" id="camera-toast">📸 Photo Saved!</div>
  </div>

  <script>
    // ============================================================
    // 1. DATABASE (IndexedDB) - Same as before
    // ============================================================
    const DB_NAME = "MahiStudioStoragePro";
    const DB_VERSION = 1;
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains("media")) {
            database.createObjectStore("media", { keyPath: "id", autoIncrement: true });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    async function saveFilesToDB(fileList, sourceType = 'folder') {
      const tx = db.transaction("media", "readwrite");
      const store = tx.objectStore("media");
      await store.clear(); 

      for (let f of fileList) {
        let type = 'unknown';
        const ext = f.name.split('.').pop().toLowerCase();
        
        if (f.type.startsWith('video/') || ['mp4','mkv','webm','avi','mov'].includes(ext)) type = 'video';
        else if (f.type.startsWith('image/') || ['jpg','jpeg','png','gif','webp','bmp'].includes(ext)) type = 'image';
        else if (f.type.startsWith('audio/') || ['mp3','wav','m4a','aac','ogg'].includes(ext)) type = 'audio';
        else if (f.type === 'application/pdf' || ext === 'pdf') type = 'pdf';

        if (type !== 'unknown') {
          let folderName = 'Main Storage';
          if (sourceType === 'folder') {
            const relPath = f.webkitRelativePath || '';
            const pathParts = relPath.split('/');
            if (pathParts.length > 1) {
              folderName = pathParts[pathParts.length - 2];
              if (!folderName) folderName = 'Root';
            }
          } else {
            folderName = 'Selected Files';
          }
          
          store.add({ 
            name: f.name, 
            folder: folderName, 
            type: type, 
            blob: f,
            sourceType: sourceType
          });
        }
      }
      return tx.complete;
    }

    async function loadFilesFromDB() {
      return new Promise((resolve) => {
        const tx = db.transaction("media", "readonly");
        const req = tx.objectStore("media").getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function updateFileName(id, newName) {
      return new Promise((resolve) => {
        const tx = db.transaction("media", "readwrite");
        const store = tx.objectStore("media");
        const req = store.get(id);
        req.onsuccess = () => {
          const data = req.result;
          data.name = newName;
          store.put(data);
          tx.oncomplete = () => resolve();
        };
      });
    }

    async function deleteFileRecord(id) {
      return new Promise((resolve) => {
        const tx = db.transaction("media", "readwrite");
        tx.objectStore("media").delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // ============================================================
    // 2. APP STATE
    // ============================================================
    let categorizedData = { video: {}, image: {}, audio: {}, pdf: {} };
    let currentCategory = '';
    let currentFolder = '';
    let currentPlaylist = [];
    let currentIndex = 0;
    let autoHideTimer = null;

    const vidPlayer = document.getElementById('vid-player');
    const audPlayer = document.getElementById('aud-player');
    const photoView = document.getElementById('photo-view');
    const pdfView = document.getElementById('pdf-view');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const scanStatus = document.getElementById('scan-status');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const icons = { 'video': '🎬', 'image': '🖼️', 'audio': '🎵', 'pdf': '📄' };

    window.onload = async () => {
      await initDB();
      await refreshData();
      setupZoomAndGestures();
      initCamera();
    };

    async function refreshData() {
      const records = await loadFilesFromDB();
      categorizedData = { video: {}, image: {}, audio: {}, pdf: {} };
      records.forEach(item => {
        if (!categorizedData[item.type][item.folder]) categorizedData[item.type][item.folder] = [];
        categorizedData[item.type][item.folder].push(item);
      });
      if (records.length > 0) {
        scanStatus.innerText = `🟢 Ready: ${records.length} Files`;
      } else {
        scanStatus.innerText = "📂 फोल्डर या फाइलें सेलेक्ट करें";
      }
    }

    // ============================================================
    // 3. SCAN FUNCTIONS
    // ============================================================
    function startScan(mode) {
      if (mode === 'folder') {
        document.getElementById('folder-input').click();
      } else {
        document.getElementById('files-input').click();
      }
    }

    async function handleScan(event, mode) {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;
      
      showLoading('💾 Files save ho rahi hain...');
      await saveFilesToDB(files, mode);
      await refreshData();
      hideLoading();
      alert(`✅ ${files.length} फाइलें सफलतापूर्वक सेव की गईं!`);
    }

    function showLoading(message) {
      loadingText.innerText = message || 'Loading...';
      loadingOverlay.classList.add('active');
    }

    function hideLoading() {
      loadingOverlay.classList.remove('active');
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function openCategory(cat) {
      const folders = Object.keys(categorizedData[cat]);
      if (folders.length === 0) { 
        alert("❌ इस कैटेगरी में कोई फाइल नहीं है।\n\nपहले 'Folder Scan' या 'Select Files' से मीडिया लोड करें।"); 
        return; 
      }
      currentCategory = cat;
      document.getElementById('folder-view-title').innerText = `${icons[cat]} ${cat.toUpperCase()}`;
      
      const grid = document.getElementById('folders-grid');
      grid.innerHTML = '';
      for (let folderName of folders) {
        const div = document.createElement('div'); div.className = 'grid-item';
        div.onclick = () => openFolder(folderName);
        div.innerHTML = `<span class="icon">${icons[cat]}</span><span class="name">${folderName}</span>`;
        grid.appendChild(div);
      }
      showScreen('folders-screen');
    }

    function openFolder(folderName) {
      currentFolder = folderName;
      currentPlaylist = categorizedData[currentCategory][folderName];
      document.getElementById('file-view-title').innerText = `📂 ${folderName}`;
      
      const grid = document.getElementById('files-grid');
      grid.innerHTML = '';

      currentPlaylist.forEach((item, index) => {
        const div = document.createElement('div'); div.className = 'grid-item';
        div.innerHTML = `<span class="icon" onclick="launchPlayer(${index})">${icons[currentCategory]}</span>
                         <span class="name" onclick="launchPlayer(${index})">${item.name}</span>`;
        
        const menuBtn = document.createElement('button');
        menuBtn.className = 'item-menu-btn'; menuBtn.innerText = '⋮';
        menuBtn.onclick = (e) => {
          e.stopPropagation();
          const action = prompt(`फाइल का नाम बदलें (Rename) या 'delete' लिखें:`, item.name);
          if (action === null) return; 
          if (action.toLowerCase().trim() === 'delete') {
            if(confirm("क्या आप सच में इसे हटाना चाहते हैं?")) {
              deleteFileRecord(item.id).then(() => { refreshData().then(() => openFolder(currentFolder)); });
            }
          } else if (action.trim() !== '') {
            updateFileName(item.id, action.trim()).then(() => { refreshData().then(() => openFolder(currentFolder)); });
          }
        };
        div.appendChild(menuBtn);
        grid.appendChild(div);
      });
      showScreen('files-screen');
    }

    // ============================================================
    // 4. MEDIA PLAYER
    // ============================================================
    let currentObjectUrl = null;

    function launchPlayer(index) {
      currentIndex = index; const item = currentPlaylist[index];
      document.getElementById('now-playing-title').innerText = item.name;

      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(item.blob);

      vidPlayer.style.display = 'none'; photoView.style.display = 'none'; pdfView.style.display = 'none'; document.getElementById('music-ui').style.display = 'none';
      vidPlayer.pause(); audPlayer.pause(); resetZoom();

      const sBar = document.getElementById('seekbar-row');
      const skipB = document.getElementById('skip-back-btn');
      const skipF = document.getElementById('skip-fwd-btn');
      const header = document.getElementById('player-header');

      if (item.type === 'pdf') {
        pdfView.style.display = 'block'; pdfView.src = currentObjectUrl;
        playPauseBtn.innerText = '📄'; sBar.style.display = 'none'; skipB.style.display = 'none'; skipF.style.display = 'none';
        header.classList.add('force-visible');
      } 
      else {
        header.classList.remove('force-visible');
        if (item.type === 'video') {
          vidPlayer.style.display = 'block'; vidPlayer.src = currentObjectUrl; vidPlayer.play(); playPauseBtn.innerText = '⏸';
          sBar.style.display = 'flex'; skipB.style.display = 'block'; skipF.style.display = 'block';
        } else if (item.type === 'audio') {
          document.getElementById('music-ui').style.display = 'flex'; audPlayer.src = currentObjectUrl; audPlayer.play(); playPauseBtn.innerText = '⏸';
          document.getElementById('music-disc').classList.add('playing'); sBar.style.display = 'flex'; skipB.style.display = 'block'; skipF.style.display = 'block';
        } else if (item.type === 'image') {
          photoView.style.display = 'block'; photoView.src = currentObjectUrl; playPauseBtn.innerText = '🖼️';
          sBar.style.display = 'none'; skipB.style.display = 'none'; skipF.style.display = 'none';
        }
      }
      showScreen('player-screen');
      if (item.type !== 'pdf') triggerControlsHUD(); 
    }

    function closePlayer() {
      vidPlayer.pause(); audPlayer.pause();
      vidPlayer.removeAttribute('src'); audPlayer.removeAttribute('src'); pdfView.removeAttribute('src');
      document.getElementById('music-disc').classList.remove('playing');
      document.getElementById('player-header').classList.remove('force-visible');
      showScreen('files-screen');
    }

    function toggleControlsHUD() {
      const header = document.getElementById('player-header');
      if (header.classList.contains('hud-hidden')) triggerControlsHUD();
      else { header.classList.add('hud-hidden'); document.getElementById('controls-bar').classList.add('hud-hidden'); }
    }

    function triggerControlsHUD() {
      document.getElementById('player-header').classList.remove('hud-hidden');
      document.getElementById('controls-bar').classList.remove('hud-hidden');
      clearTimeout(autoHideTimer);
      autoHideTimer = setTimeout(() => {
        document.getElementById('player-header').classList.add('hud-hidden');
        document.getElementById('controls-bar').classList.add('hud-hidden');
      }, 4000);
    }

    function togglePlay() {
      if (currentCategory === 'image' || currentCategory === 'pdf') return;
      const p = currentCategory === 'video' ? vidPlayer : audPlayer;
      if (p.paused) { p.play(); playPauseBtn.innerText = '⏸'; if(currentCategory==='audio') document.getElementById('music-disc').classList.add('playing'); } 
      else { p.pause(); playPauseBtn.innerText = '▶'; if(currentCategory==='audio') document.getElementById('music-disc').classList.remove('playing'); }
      triggerControlsHUD();
    }

    function skipMedia(sec) {
      if (currentCategory === 'image' || currentCategory === 'pdf') return;
      const p = currentCategory === 'video' ? vidPlayer : audPlayer;
      p.currentTime += sec; triggerControlsHUD();
    }
    function nextMedia() { if (currentIndex < currentPlaylist.length - 1) launchPlayer(currentIndex + 1); }
    function prevMedia() { if (currentIndex > 0) launchPlayer(currentIndex - 1); }

    function updateSeekbar(player) {
      if (player.duration) {
        document.getElementById('seek-slider').max = player.duration; document.getElementById('seek-slider').value = player.currentTime;
        document.getElementById('curr-time').innerText = formatTime(player.currentTime); document.getElementById('total-time').innerText = formatTime(player.duration);
      }
      if (player.ended) nextMedia();
    }
    vidPlayer.addEventListener('timeupdate', () => updateSeekbar(vidPlayer));
    audPlayer.addEventListener('timeupdate', () => updateSeekbar(audPlayer));
    function seekMedia(val) { const p = currentCategory === 'video' ? vidPlayer : audPlayer; p.currentTime = val; }
    function formatTime(sec) { const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' + s : s); }

    function toggleOrientation() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }).catch(()=>{});
      } else { document.exitFullscreen().then(() => { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }).catch(()=>{}); }
    }

    // ============================================================
    // 5. ZOOM
    // ============================================================
    let currentScale = 1; let initialDistance = 0;

    function resetZoom() {
      currentScale = 1;
      vidPlayer.style.transform = `scale(1)`; photoView.style.transform = `scale(1)`;
    }

    function setupZoomAndGestures() {
      const stage = document.getElementById('media-stage');
      
      stage.addEventListener('dblclick', (e) => {
        if (currentCategory !== 'image' && currentCategory !== 'video') return;
        currentScale = currentScale === 1 ? 2.5 : 1;
        const target = currentCategory === 'video' ? vidPlayer : photoView;
        target.style.transform = `scale(${currentScale})`;
      });

      stage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2 && (currentCategory === 'image' || currentCategory === 'video')) {
          initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        }
      }, { passive: false });

      stage.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && (currentCategory === 'image' || currentCategory === 'video')) {
          e.preventDefault();
          const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
          const delta = currentDistance / initialDistance;
          currentScale = Math.min(Math.max(1, currentScale * delta), 4);
          const target = currentCategory === 'video' ? vidPlayer : photoView;
          target.style.transform = `scale(${currentScale})`;
          initialDistance = currentDistance;
        }
      }, { passive: false });
    }

    // ============================================================
    // 6. CAMERA WITH REAL FILTERS (Canvas-based pixel manipulation)
    // ============================================================
    let cameraStream = null;
    let cameraFacing = 'environment'; // start with back camera
    let currentFilter = 'normal';
    const cameraVideo = document.getElementById('video-preview');
    const cameraContainer = document.getElementById('camera-container');
    const flashEffect = document.getElementById('flash-effect');
    const cameraToast = document.getElementById('camera-toast');
    const filterBar = document.getElementById('filter-bar');

    // ========== REAL FILTER DEFINITIONS (Canvas Pixel Manipulation) ==========
    const FILTERS = {
      normal: {
        name: 'Normal',
        apply: (data) => data // no change
      },
      beauty: {
        name: '✨ Beauty',
        apply: (data) => {
          // Skin smoothing + brightness + slight pink tint
          for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            // Brightness boost
            r = Math.min(255, r + 15);
            g = Math.min(255, g + 12);
            b = Math.min(255, b + 10);
            // Slight pink/warm tint
            r = Math.min(255, r + 8);
            b = Math.min(255, b + 4);
            // Soft contrast
            r = Math.min(255, Math.max(0, (r - 128) * 1.1 + 128));
            g = Math.min(255, Math.max(0, (g - 128) * 1.08 + 128));
            b = Math.min(255, Math.max(0, (b - 128) * 1.05 + 128));
            data[i] = r; data[i+1] = g; data[i+2] = b;
          }
          return data;
        }
      },
      summer: {
        name: '☀️ Summer',
        apply: (data) => {
          for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            // Warm golden tones
            r = Math.min(255, r + 30);
            g = Math.min(255, g + 15);
            b = Math.min(255, b - 10);
            // High contrast
            r = Math.min(255, Math.max(0, (r - 128) * 1.2 + 128));
            g = Math.min(255, Math.max(0, (g - 128) * 1.15 + 128));
            b = Math.min(255, Math.max(0, (b - 128) * 0.9 + 128));
            data[i] = r; data[i+1] = g; data[i+2] = b;
          }
          return data;
        }
      },
      vibrant: {
        name: '🌈 Vibrant',
        apply: (data) => {
          for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            // Boost saturation
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            const sat = 1.5;
            r = Math.min(255, Math.max(0, gray + sat * (r - gray)));
            g = Math.min(255, Math.max(0, gray + sat * (g - gray)));
            b = Math.min(255, Math.max(0, gray + sat * (b - gray)));
            // Slight contrast
            r = Math.min(255, Math.max(0, (r - 128) * 1.1 + 128));
            g = Math.min(255, Math.max(0, (g - 128) * 1.1 + 128));
            b = Math.min(255, Math.max(0, (b - 128) * 1.1 + 128));
            data[i] = r; data[i+1] = g; data[i+2] = b;
          }
          return data;
        }
      },
      cool: {
        name: '❄️ Cool',
        apply: (data) => {
          for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            // Blue/cool tint
            r = Math.min(255, r - 15);
            g = Math.min(255, g + 5);
            b = Math.min(255, b + 25);
            data[i] = r; data[i+1] = g; data[i+2] = b;
          }
          return data;
        }
      },
      vintage: {
        name: '📻 Vintage',
        apply: (data) => {
          for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            // Sepia tone
            const tr = 0.393 * r + 0.769 * g + 0.189 * b;
            const tg = 0.349 * r + 0.686 * g + 0.168 * b;
            const tb = 0.272 * r + 0.534 * g + 0.131 * b;
            r = Math.min(255, tr + 15);
            g = Math.min(255, tg + 8);
            b = Math.min(255, tb - 5);
            data[i] = r; data[i+1] = g; data[i+2] = b;
          }
          return data;
        }
      },
      noir: {
        name: '🎬 Noir',
        apply: (data) => {
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            // Grayscale with high contrast
            let gray = 0.299 * r + 0.587 * g + 0.114 * b;
            gray = Math.min(255, Math.max(0, (gray - 128) * 1.4 + 128));
            data[i] = gray; data[i+1] = gray; data[i+2] = gray;
          }
          return data;
        }
      }
    };

    // ========== CAMERA SETUP ==========
    function initCamera() {
      // Build filter bar
      filterBar.innerHTML = '';
      Object.keys(FILTERS).forEach(key => {
        const chip = document.createElement('span');
        chip.className = `filter-chip ${key === currentFilter ? 'active' : ''}`;
        chip.textContent = FILTERS[key].name;
        chip.dataset.filter = key;
        chip.onclick = () => {
          currentFilter = key;
          document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          showToast('📸 ' + FILTERS[key].name + ' filter');
        };
        filterBar.appendChild(chip);
      });
    }

    async function openCamera() {
      cameraContainer.classList.add('active');
      document.getElementById('home-screen').classList.remove('active');
      
      try {
        if (cameraStream) {
          cameraStream.getTracks().forEach(t => t.stop());
        }
        const constraints = {
          video: { facingMode: cameraFacing, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        };
        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
        cameraVideo.srcObject = cameraStream;
        await cameraVideo.play();
      } catch (err) {
        alert('Camera access denied! Please allow camera permission.');
        closeCamera();
      }
    }

    function closeCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      cameraContainer.classList.remove('active');
      document.getElementById('home-screen').classList.add('active');
    }

    function switchCamera() {
      cameraFacing = cameraFacing === 'environment' ? 'user' : 'environment';
      openCamera();
      showToast('🔄 Camera switched');
    }

    // ========== CAPTURE PHOTO WITH REAL FILTERS ==========
    function capturePhoto() {
      // Flash effect
      flashEffect.classList.add('active');
      setTimeout(() => flashEffect.classList.remove('active'), 200);

      const video = cameraVideo;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      // Get actual video dimensions
      const w = video.videoWidth || 1280;
      const h = video.videoHeight || 720;
      canvas.width = w;
      canvas.height = h;

      // Draw video frame to canvas
      ctx.drawImage(video, 0, 0, w, h);

      // Get pixel data
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;

      // Apply selected filter (pixel manipulation)
      const filterFn = FILTERS[currentFilter]?.apply || FILTERS.normal.apply;
      const filteredData = filterFn(data);

      // Put processed data back
      ctx.putImageData(imageData, 0, 0);

      // Create download
      canvas.toBlob((blob) => {
        if (!blob) return;
        const fileName = `CamPlus_${Date.now()}.jpg`;
        const file = new File([blob], fileName, { type: 'image/jpeg' });
        
        // Save to IndexedDB
        saveFileToDB(file);
        
        // Also download
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
        
        showToast('✅ Photo saved!');
      }, 'image/jpeg', 0.92);
    }

    async function saveFileToDB(file) {
      const tx = db.transaction("media", "readwrite");
      const store = tx.objectStore("media");
      store.add({
        name: file.name,
        folder: 'Camera',
        type: 'image',
        blob: file,
        sourceType: 'camera'
      });
      await tx.complete;
      await refreshData();
    }

    function showToast(msg) {
      cameraToast.textContent = msg;
      cameraToast.classList.add('show');
      setTimeout(() => cameraToast.classList.remove('show'), 2000);
    }

    // ============================================================
    // 7. KEYBOARD SHORTCUT: ESC to close camera
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && cameraContainer.classList.contains('active')) {
        closeCamera();
      }
    });

  </script>
