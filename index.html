<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mahi-Media_Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: #ffb6c1;
      min-height: 100vh;
      padding: 10px;
      overflow-y: auto;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 14px;
      min-height: 95vh;
    }
    
    h1 {
      text-align: center;
      color: #d81b60;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    
    .scan-section {
      background: rgba(255,255,255,0.5);
      padding: 10px;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    
    .btn {
      flex: 1;
      min-width: 70px;
      padding: 8px 10px;
      border: none;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
      color: white;
      text-align: center;
    }
    
    .btn:active { transform: scale(0.93); }
    .btn-folder { background: #2e7d32; }
    .btn-files { background: #d81b60; }
    .btn-camera { background: #1565c0; }
    .btn-all { background: #6a1b9a; }
    
    .status {
      text-align: center;
      padding: 6px;
      background: rgba(255,255,255,0.6);
      border-radius: 8px;
      margin: 6px 0;
      font-weight: 600;
      font-size: 0.75rem;
      color: #333;
    }
    
    .hidden-input { display: none; }
    
    .folder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    
    .folder-card {
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.6);
      border: 2px solid rgba(255,255,255,0.8);
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      font-weight: 600;
      font-size: 0.85rem;
    }
    
    .folder-card:active { background: #d81b60; color: white; transform: scale(0.95); }
    .folder-card .icon { font-size: 1.8rem; display: block; margin-bottom: 2px; }
    .folder-card .count { font-size: 0.6rem; opacity: 0.6; font-weight: 400; }
    
    .file-list {
      margin-top: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .file-item {
      background: rgba(255,255,255,0.5);
      padding: 8px 12px;
      margin: 3px 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.1s;
      font-size: 0.85rem;
    }
    
    .file-item:active { background: #d81b60; color: white; }
    .file-item .ficon { font-size: 1.2rem; }
    .file-item .fname { flex: 1; word-break: break-word; }
    .file-item .fmenu { font-size: 1.1rem; padding: 0 4px; cursor: pointer; }
    
    .back-btn {
      background: #d81b60;
      color: white;
      border: none;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 6px;
      font-size: 0.75rem;
    }
    
    .back-btn:active { transform: scale(0.95); }
    
    /* ========== PLAYER ========== */
    .player-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 999;
      display: none;
      flex-direction: column;
    }
    .player-overlay.active { display: flex; }
    
    .player-top {
      padding: 8px 12px;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      z-index: 10;
    }
    .player-top button {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .player-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }
    .player-content video, .player-content img, .player-content iframe {
      max-width: 100%;
      max-height: 100%;
    }
    .player-content iframe { width: 100%; height: 100%; border: none; background: white; }
    .player-controls {
      padding: 8px;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }
    .player-controls button {
      background: none;
      border: none;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .player-controls .play-btn { font-size: 2rem; color: #d81b60; }
    
    /* ========== CAMERA ========== */
    .camera-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .camera-overlay.active { display: flex; }
    
    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform-origin: center;
      /* filter is applied live via JS so the preview matches the captured photo */
      transition: filter 0.15s ease;
    }
    
    /* Zoom Control */
    .cam-zoom-control {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 15;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border-radius: 25px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .cam-zoom-control .z-label {
      color: white;
      font-size: 0.6rem;
      font-weight: 700;
    }
    .cam-zoom-control .zoom-slider-wrap {
      width: 34px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .cam-zoom-control input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      background: rgba(255,255,255,0.35);
      border-radius: 2px;
      outline: none;
      transform: rotate(-90deg);
      transform-origin: center;
    }
    .cam-zoom-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d81b60;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    .cam-zoom-control input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d81b60;
      cursor: pointer;
      border: none;
    }
    
    /* Camera Controls */
    .camera-controls {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      padding: 0 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }
    .cam-shutter {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: white;
      border: 4px solid rgba(255,255,255,0.5);
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .cam-shutter:active { transform: scale(0.8); }
    .cam-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }
    .cam-btn:active { transform: scale(0.9); }
    .camera-flash {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.05s;
    }
    .camera-flash.active { opacity: 0.9; }

    .flash-btn.on { background: #ffd700; color: #000; }

    .mode-toggle-row {
      position: absolute;
      bottom: 168px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 10;
    }
    .mode-btn {
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      border: none;
      color: rgba(255,255,255,0.65);
      padding: 5px 18px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .mode-btn.active { color: #d81b60; background: rgba(255,255,255,0.92); }

    .rec-timer {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(216,27,96,0.9);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 5px;
      z-index: 15;
    }
    .rec-timer.active { display: flex; }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: white; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    .cam-shutter.recording {
      background: #e74c3c;
      border-radius: 16px;
      width: 34px;
      height: 34px;
      margin: 14px;
    }
    
    /* Filter Row - Instagram Style */
    .filter-row {
      position: absolute;
      bottom: 100px;
      left: 0;
      width: 100%;
      padding: 4px 10px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      z-index: 10;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }
    .filter-row::-webkit-scrollbar { display: none; }
    
    .filter-item {
      flex: 0 0 55px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: 0.15s;
      padding: 3px;
      border-radius: 8px;
    }
    .filter-item:active { transform: scale(0.9); }
    .filter-item.active { background: rgba(216, 27, 96, 0.3); border-radius: 10px; }
    
    .filter-preview {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      background: #333;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    .filter-item.active .filter-preview {
      border-color: #d81b60;
      box-shadow: 0 0 12px rgba(216, 27, 96, 0.4);
    }
    .filter-name {
      font-size: 0.5rem;
      color: white;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    .filter-item.active .filter-name { color: #d81b60; }
    
    .toast-msg {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      opacity: 0;
      transition: 0.3s;
      z-index: 9999;
      pointer-events: none;
    }
    .toast-msg.show { opacity: 1; }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .loading-overlay.active { display: flex; }
    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #d81b60;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text { color: white; margin-top: 8px; font-size: 0.8rem; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container" id="app">
  <h1>📱 Mahi-Media_Pro</h1>
  
  <div class="scan-section">
    <div class="btn-group">
      <button class="btn btn-folder" onclick="selectFolder()">📁 Folder</button>
      <button class="btn btn-files" onclick="selectFiles()">📄 Files</button>
      <button class="btn btn-camera" onclick="openCamera()">📷 Camera</button>
      <button class="btn btn-all" onclick="showAllFiles()">📂 All</button>
    </div>
  </div>
  
  <div class="status" id="status">📂 Select folder or files</div>
  
  <input type="file" id="folderInput" class="hidden-input" webkitdirectory multiple onchange="handleFolderSelect(event)">
  <input type="file" id="fileInput" class="hidden-input" multiple accept="video/*,audio/*,image/*,.pdf" onchange="handleFileSelect(event)">
  
  <div id="folderView">
    <div class="folder-grid" id="folderGrid"></div>
  </div>
  
  <div id="fileView" style="display:none;">
    <button class="back-btn" onclick="showFolders()">⬅ Back</button>
    <div class="file-list" id="fileList"></div>
  </div>
</div>

<!-- Player -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-top">
    <span id="playerTitle" style="flex:1;font-weight:600;font-size:0.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">File</span>
    <button onclick="closePlayer()">✖</button>
  </div>
  <div class="player-content" id="playerContent">
    <video id="videoPlayer" playsinline></video>
    <img id="imagePlayer" src="">
    <iframe id="pdfPlayer"></iframe>
    <div id="audioPlayer" style="display:none;color:white;text-align:center;padding:20px;">
      <div style="font-size:3.5rem;">🎵</div>
      <div style="margin-top:8px;font-size:0.85rem;font-weight:600;" id="audioName"></div>
      <audio id="audioElem" controls style="width:90%;max-width:300px;margin-top:12px;"></audio>
    </div>
  </div>
  <div class="player-controls">
    <button onclick="prevFile()">⏮</button>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">⏸</button>
    <button onclick="nextFile()">⏭</button>
  </div>
</div>

<!-- Camera -->
<div class="camera-overlay" id="cameraOverlay">
  <video id="camera-video" autoplay playsinline muted></video>
  <canvas id="recordCanvas" style="display:none;"></canvas>
  <div class="camera-flash" id="cameraFlash"></div>

  <div class="rec-timer" id="recTimer"><span class="rec-dot"></span><span id="recTimeText">00:00</span></div>

  <div class="cam-zoom-control">
    <span class="z-label" id="zoomLabel">1.0x</span>
    <div class="zoom-slider-wrap">
      <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" oninput="updateZoom(this.value)">
    </div>
  </div>

  <div class="mode-toggle-row">
    <button class="mode-btn active" id="modePhotoBtn" onclick="setCameraMode('photo')">PHOTO</button>
    <button class="mode-btn" id="modeVideoBtn" onclick="setCameraMode('video')">VIDEO</button>
  </div>

  <div class="filter-row" id="filterRow"></div>

  <div class="camera-controls">
    <button class="cam-btn flash-btn" id="flashBtn" onclick="toggleFlash()" style="display:none;">⚡ Off</button>
    <button class="cam-btn" onclick="closeCamera()">✖</button>
    <div class="cam-shutter" id="shutterBtn" onclick="handleShutter()"></div>
    <button class="cam-btn" onclick="switchCamera()">🔄</button>
  </div>
</div>

<div class="toast-msg" id="toastMsg"></div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Loading...</div>
</div>

<script>
// ================================================================
// DATABASE
// ================================================================
const DB_NAME = "MahiMediaDB";
let db = null;

function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("media")) {
        db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
  });
}

function saveFiles(files, source) {
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readwrite");
    const store = tx.objectStore("media");
    files.forEach(f => {
      const ext = f.name.split('.').pop().toLowerCase();
      let type = 'unknown';
      if (f.type.startsWith('video/') || ['mp4','mkv','webm','avi','mov','3gp'].includes(ext)) type = 'video';
      else if (f.type.startsWith('image/') || ['jpg','jpeg','png','gif','webp','bmp'].includes(ext)) type = 'image';
      else if (f.type.startsWith('audio/') || ['mp3','wav','m4a','aac','ogg'].includes(ext)) type = 'audio';
      else if (f.type === 'application/pdf' || ext === 'pdf') type = 'pdf';
      if (type !== 'unknown') {
        let folder = 'Main';
        if (source === 'folder' && f.webkitRelativePath) {
          const parts = f.webkitRelativePath.split('/');
          if (parts.length > 1) folder = parts[parts.length - 2];
        } else if (source === 'camera') {
          folder = '📸 Camera';
        } else {
          folder = '📁 Selected';
        }
        store.add({ name: f.name, type: type, folder: folder, blob: f });
      }
    });
    tx.oncomplete = () => resolve();
  });
}

function loadAllFiles() {
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readonly");
    const req = tx.objectStore("media").getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

function deleteFile(id) {
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readwrite");
    tx.objectStore("media").delete(id);
    tx.oncomplete = () => resolve();
  });
}

// ================================================================
// APP STATE
// ================================================================
let allFiles = [];
let currentFolder = '';
let currentPlaylist = [];
let currentIndex = 0;
let currentPlayer = null;

// ================================================================
// FILE SELECTION
// ================================================================
function selectFolder() { document.getElementById('folderInput').click(); }
function selectFiles() { document.getElementById('fileInput').click(); }

async function handleFolderSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  showLoading('📁 Processing...');
  await saveFiles(files, 'folder');
  await refreshData();
  hideLoading();
  showToast(`✅ ${files.length} files loaded!`);
  e.target.value = '';
}

async function handleFileSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  showLoading('📄 Processing...');
  await saveFiles(files, 'files');
  await refreshData();
  hideLoading();
  showToast(`✅ ${files.length} files loaded!`);
  e.target.value = '';
}

// ================================================================
// UI
// ================================================================
async function refreshData() {
  allFiles = await loadAllFiles();
  document.getElementById('status').innerHTML = `📂 ${allFiles.length} files total`;
  showFolders();
}

function showFolders() {
  document.getElementById('folderView').style.display = 'block';
  document.getElementById('fileView').style.display = 'none';
  const grid = document.getElementById('folderGrid');
  grid.innerHTML = '';
  const folders = {};
  allFiles.forEach(f => { if (!folders[f.folder]) folders[f.folder] = []; folders[f.folder].push(f); });
  const iconMap = { video:'🎬', audio:'🎵', image:'🖼️', pdf:'📄' };
  Object.keys(folders).forEach(folder => {
    const files = folders[folder];
    const counts = { video:0, audio:0, image:0, pdf:0 };
    files.forEach(f => { if (counts[f.type] !== undefined) counts[f.type]++; });
    const summary = Object.keys(counts).filter(k => counts[k] > 0).map(k => `${iconMap[k]}${counts[k]}`).join(' ');
    const card = document.createElement('div');
    card.className = 'folder-card';
    card.innerHTML = `<span class="icon">📂</span>${folder}<div class="count">${files.length} files ${summary}</div>`;
    card.onclick = () => openFolder(folder);
    grid.appendChild(card);
  });
  if (Object.keys(folders).length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#666;padding:20px;">No files. Select a folder or files above.</p>';
  }
}

function openFolder(folder) {
  currentFolder = folder;
  currentPlaylist = allFiles.filter(f => f.folder === folder);
  document.getElementById('folderView').style.display = 'none';
  document.getElementById('fileView').style.display = 'block';
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  const iconMap = { video:'🎬', audio:'🎵', image:'🖼️', pdf:'📄' };
  currentPlaylist.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'file-item';
    const globalIdx = allFiles.indexOf(item);
    div.innerHTML = `
      <span class="ficon">${iconMap[item.type] || '📄'}</span>
      <span class="fname">${item.name}</span>
      <span class="fmenu" onclick="event.stopPropagation();showFileMenu(${item.id}, '${item.name}')">⋮</span>
    `;
    div.onclick = () => playFile(globalIdx);
    list.appendChild(div);
  });
}

function showAllFiles() {
  currentFolder = 'All Files';
  currentPlaylist = allFiles;
  document.getElementById('folderView').style.display = 'none';
  document.getElementById('fileView').style.display = 'block';
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  const iconMap = { video:'🎬', audio:'🎵', image:'🖼️', pdf:'📄' };
  currentPlaylist.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'file-item';
    const globalIdx = allFiles.indexOf(item);
    div.innerHTML = `
      <span class="ficon">${iconMap[item.type] || '📄'}</span>
      <span class="fname">${item.name}</span>
      <span style="font-size:0.6rem;opacity:0.5;">${item.folder}</span>
      <span class="fmenu" onclick="event.stopPropagation();showFileMenu(${item.id}, '${item.name}')">⋮</span>
    `;
    div.onclick = () => playFile(globalIdx);
    list.appendChild(div);
  });
}

function showFileMenu(id, name) {
  const action = prompt(`Rename or type 'delete':\n${name}`, name);
  if (action === null) return;
  if (action.toLowerCase().trim() === 'delete') {
    if (confirm('Delete this file?')) {
      deleteFile(id).then(refreshData);
      showToast('🗑️ Deleted');
    }
  } else if (action.trim() && action.trim() !== name) {
    const tx = db.transaction("media", "readwrite");
    const store = tx.objectStore("media");
    const req = store.get(id);
    req.onsuccess = () => {
      const data = req.result;
      data.name = action.trim();
      store.put(data);
      tx.oncomplete = () => { refreshData(); showToast('✏️ Renamed'); };
    };
  }
}

// ================================================================
// PLAYER
// ================================================================
function playFile(index) {
  currentIndex = index;
  const item = allFiles[index];
  if (!item) return;
  const overlay = document.getElementById('playerOverlay');
  document.getElementById('playerTitle').textContent = item.name;
  const video = document.getElementById('videoPlayer');
  const image = document.getElementById('imagePlayer');
  const pdf = document.getElementById('pdfPlayer');
  const audio = document.getElementById('audioPlayer');
  const audioElem = document.getElementById('audioElem');
  const audioName = document.getElementById('audioName');
  video.style.display = 'none';
  image.style.display = 'none';
  pdf.style.display = 'none';
  audio.style.display = 'none';
  video.pause();
  audioElem.pause();
  const url = URL.createObjectURL(item.blob);
  if (item.type === 'video') {
    video.style.display = 'block';
    video.src = url;
    video.play();
    currentPlayer = video;
  } else if (item.type === 'image') {
    image.style.display = 'block';
    image.src = url;
    currentPlayer = null;
  } else if (item.type === 'pdf') {
    pdf.style.display = 'block';
    pdf.src = url;
    currentPlayer = null;
  } else if (item.type === 'audio') {
    audio.style.display = 'block';
    audioName.textContent = item.name;
    audioElem.src = url;
    audioElem.play();
    currentPlayer = audioElem;
  }
  overlay.classList.add('active');
}

function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('active');
  document.getElementById('videoPlayer').pause();
  document.getElementById('videoPlayer').src = '';
  document.getElementById('imagePlayer').src = '';
  document.getElementById('pdfPlayer').src = '';
  document.getElementById('audioElem').pause();
  document.getElementById('audioElem').src = '';
}

function togglePlay() {
  if (!currentPlayer) return;
  const btn = document.getElementById('playBtn');
  if (currentPlayer.paused) {
    currentPlayer.play();
    btn.textContent = '⏸';
  } else {
    currentPlayer.pause();
    btn.textContent = '▶';
  }
}

function nextFile() {
  const idx = currentPlaylist.indexOf(allFiles[currentIndex]);
  if (idx < currentPlaylist.length - 1) {
    const newIdx = allFiles.indexOf(currentPlaylist[idx + 1]);
    playFile(newIdx);
  }
}

function prevFile() {
  const idx = currentPlaylist.indexOf(allFiles[currentIndex]);
  if (idx > 0) {
    const newIdx = allFiles.indexOf(currentPlaylist[idx - 1]);
    playFile(newIdx);
  }
}

document.addEventListener('ended', () => {
  if (document.getElementById('playerOverlay').classList.contains('active')) nextFile();
});

// ================================================================
// CAMERA WITH REAL, LIVE CSS/CANVAS FILTERS (INSTAGRAM-STYLE)
// ================================================================
// Instead of manual per-pixel math (which was fake/inaccurate and only
// showed up AFTER capture), we now use the browser's native filter
// engine (same primitives real camera apps use: brightness, contrast,
// saturate, sepia, hue-rotate, grayscale). The filter is applied LIVE
// on the video preview, so what you see is exactly what gets captured
// (WYSIWYG) — this is how Instagram/Snapchat-style web camera UIs work.
let cameraStream = null;
let facingMode = 'environment';
let currentFilter = 'normal';
let cameraZoom = 1;
let cameraMode = 'photo';        // 'photo' | 'video'
let torchSupported = false;
let torchOn = false;
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let recordTimerInterval = null;
let recordSeconds = 0;
let drawLoopId = null;

// ========== FILTER DEFINITIONS (CSS filter() functions) ==========
const FILTERS = {
  normal:     { name: 'Normal',     preview: '#888',    css: 'none' },
  clarendon:  { name: 'Clarendon',  preview: '#f4a460',  css: 'contrast(1.2) saturate(1.35) brightness(1.05)' },
  summer:     { name: 'Summer',     preview: '#f7dc6f',  css: 'contrast(1.1) saturate(1.3) brightness(1.08) sepia(0.15)' },
  vibrant:    { name: 'Vibrant',    preview: '#e74c3c',  css: 'saturate(1.8) contrast(1.15)' },
  cool:       { name: 'Cool',       preview: '#5dade2',  css: 'hue-rotate(-8deg) saturate(1.15) brightness(1.03) contrast(1.05)' },
  warm:       { name: 'Warm',       preview: '#f0b27a',  css: 'sepia(0.25) saturate(1.25) brightness(1.05)' },
  bw:         { name: 'B&W',        preview: '#555',     css: 'grayscale(1) contrast(1.15) brightness(1.05)' },
  cinematic:  { name: 'Cinematic',  preview: '#2c3e50',  css: 'contrast(1.3) saturate(0.85) brightness(0.95) sepia(0.1)' },
  gingham:    { name: 'Gingham',    preview: '#d4a5a5',  css: 'brightness(1.05) sepia(0.2) contrast(0.9)' },
  moon:       { name: 'Moon',       preview: '#95a5a6',  css: 'grayscale(1) contrast(1.4) brightness(1.1)' },
  lark:       { name: 'Lark',       preview: '#c9b99a',  css: 'saturate(1.3) contrast(0.95) brightness(1.08)' },
  reyes:      { name: 'Reyes',      preview: '#b8a090',  css: 'sepia(0.4) contrast(0.85) brightness(1.1) saturate(0.8)' }
};

// ========== CAMERA UI ==========
function initCameraUI() {
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  
  Object.keys(FILTERS).forEach(key => {
    const item = document.createElement('div');
    item.className = `filter-item ${key === currentFilter ? 'active' : ''}`;
    
    const preview = document.createElement('div');
    preview.className = 'filter-preview';
    preview.style.background = FILTERS[key].preview;
    
    const name = document.createElement('span');
    name.className = 'filter-name';
    name.textContent = FILTERS[key].name;
    
    item.appendChild(preview);
    item.appendChild(name);
    
    item.onclick = () => {
      currentFilter = key;
      applyLiveFilter();
      document.querySelectorAll('.filter-item').forEach(c => c.classList.remove('active'));
      item.classList.add('active');
      showToast(`📸 ${FILTERS[key].name}`);
    };
    row.appendChild(item);
  });
}

// Applies the selected filter to the LIVE video preview so it's WYSIWYG
function applyLiveFilter() {
  const video = document.getElementById('camera-video');
  const filterCss = FILTERS[currentFilter]?.css || 'none';
  if (facingMode === 'user') {
    video.style.filter = filterCss;
  } else {
    video.style.filter = filterCss;
  }
}

async function openCamera() {
  document.getElementById('cameraOverlay').classList.add('active');
  initCameraUI();
  document.getElementById('zoomSlider').value = 1;
  document.getElementById('zoomLabel').textContent = '1.0x';
  cameraZoom = 1;

  try {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
    }
    const baseVideo = { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } };
    // Request mic too so VIDEO mode has audio ready — if user blocks mic, retry without it.
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: baseVideo, audio: true });
    } catch (audioErr) {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: baseVideo, audio: false });
    }
    document.getElementById('camera-video').srcObject = cameraStream;
    await document.getElementById('camera-video').play();
    applyLiveFilter();
    checkTorchSupport();
    showToast('📷 Camera ready');
  } catch (err) {
    alert('❌ Camera access denied!\nPlease allow camera permission.');
    closeCamera();
  }
}

function closeCamera() {
  if (isRecording) stopRecording();
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  document.getElementById('cameraOverlay').classList.remove('active');
}

function switchCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  openCamera();
}

// ========== FLASH / TORCH ==========
function checkTorchSupport() {
  const track = cameraStream.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  torchSupported = !!caps.torch;
  const btn = document.getElementById('flashBtn');
  torchOn = false;
  if (torchSupported) {
    btn.style.display = 'inline-block';
    btn.textContent = '⚡ Off';
    btn.classList.remove('on');
  } else {
    // Most front cameras and iOS Safari don't expose torch control to the web —
    // hide the button instead of showing something that silently fails.
    btn.style.display = 'none';
  }
}

async function toggleFlash() {
  if (!torchSupported || !cameraStream) return;
  torchOn = !torchOn;
  const track = cameraStream.getVideoTracks()[0];
  try {
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    const btn = document.getElementById('flashBtn');
    btn.textContent = torchOn ? '⚡ On' : '⚡ Off';
    btn.classList.toggle('on', torchOn);
  } catch (e) {
    showToast('❌ Flash not supported on this device');
    torchOn = false;
  }
}

// ========== PHOTO / VIDEO MODE ==========
function setCameraMode(mode) {
  if (isRecording) return;
  cameraMode = mode;
  document.getElementById('modePhotoBtn').classList.toggle('active', mode === 'photo');
  document.getElementById('modeVideoBtn').classList.toggle('active', mode === 'video');
}

function handleShutter() {
  if (cameraMode === 'photo') {
    takePhoto();
  } else {
    if (!isRecording) startVideoRecording(); else stopRecording();
  }
}

function updateZoom(val) {
  cameraZoom = parseFloat(val);
  document.getElementById('zoomLabel').textContent = cameraZoom.toFixed(1) + 'x';
  const video = document.getElementById('camera-video');
  if (facingMode === 'user') {
    video.style.transform = `scaleX(-1) scale(${cameraZoom})`;
  } else {
    video.style.transform = `scale(${cameraZoom})`;
  }
}

// ========== VIDEO RECORDING — filter baked in frame-by-frame via canvas ==========
function startVideoRecording() {
  const video = document.getElementById('camera-video');
  const canvas = document.getElementById('recordCanvas');
  const w = video.videoWidth || 1280;
  const h = video.videoHeight || 720;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  isRecording = true;
  recordedChunks = [];
  recordSeconds = 0;
  document.getElementById('recTimer').classList.add('active');
  document.getElementById('recTimeText').textContent = '00:00';
  recordTimerInterval = setInterval(() => {
    recordSeconds++;
    const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
    const s = String(recordSeconds % 60).padStart(2, '0');
    document.getElementById('recTimeText').textContent = `${m}:${s}`;
  }, 1000);
  document.getElementById('shutterBtn').classList.add('recording');

  function drawFrame() {
    if (!isRecording) return;
    const zoom = cameraZoom;
    const sw = w / zoom, sh = h / zoom;
    const sx = (w - sw) / 2, sy = (h - sh) / 2;
    ctx.filter = FILTERS[currentFilter]?.css || 'none';
    ctx.save();
    if (facingMode === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
    ctx.restore();
    drawLoopId = requestAnimationFrame(drawFrame);
  }
  drawFrame();

  const canvasStream = canvas.captureStream(30);
  const audioTracks = cameraStream.getAudioTracks();
  if (audioTracks.length) canvasStream.addTrack(audioTracks[0]);

  const mimeCandidates = ['video/mp4;codecs=h264', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';

  mediaRecorder = new MediaRecorder(canvasStream, { mimeType });
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    cancelAnimationFrame(drawLoopId);
    const blob = new Blob(recordedChunks, { type: mimeType });
    const fileName = `VID_${Date.now()}.${ext}`;
    const file = new File([blob], fileName, { type: mimeType });
    await saveMediaBlob(file, fileName, 'video');
  };
  mediaRecorder.start();
  showToast('🔴 Recording...');
}

function stopRecording() {
  isRecording = false;
  clearInterval(recordTimerInterval);
  document.getElementById('recTimer').classList.remove('active');
  document.getElementById('shutterBtn').classList.remove('recording');
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

// ========== SAVE TO GALLERY (reliable on mobile) ==========
// A plain <a download> click is silently ignored by many mobile/in-app
// browsers. The Web Share API's file-sharing (navigator.share with files)
// is what actually opens the native "Save to Photos / Save to device" sheet
// on Android Chrome and iOS Safari — so we try that first, and only fall
// back to the anchor-download trick on desktop where Share isn't available.
async function saveMediaBlob(file, fileName, mediaType) {
  showLoading(mediaType === 'video' ? '🎥 Saving video...' : '📸 Saving photo...');
  await saveFiles([file], 'camera');
  await refreshData();
  hideLoading();

  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: fileName });
      showToast('✅ Saved!');
      return;
    }
  } catch (shareErr) {
    // User backed out of the share sheet — file is already safe in the app's library.
    showToast('✅ Saved in app (share cancelled)');
    return;
  }

  // Desktop fallback
  const link = document.createElement('a');
  link.href = URL.createObjectURL(file);
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('✅ Saved to app + Downloads!');
}

// ========== TAKE PHOTO — same filter as live preview, applied via canvas ==========
function takePhoto() {
  // Flash effect
  const flash = document.getElementById('cameraFlash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 200);
  
  const video = document.getElementById('camera-video');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  const w = video.videoWidth || 1280;
  const h = video.videoHeight || 720;
  canvas.width = w;
  canvas.height = h;
  
  // Apply the SAME filter the user saw live in preview (WYSIWYG)
  ctx.filter = FILTERS[currentFilter]?.css || 'none';
  
  // Apply zoom
  const zoom = cameraZoom;
  const sw = w / zoom;
  const sh = h / zoom;
  const sx = (w - sw) / 2;
  const sy = (h - sh) / 2;
  
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  
  // Mirror for front camera
  if (facingMode === 'user') {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w;
    tempCanvas.height = h;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(canvas, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.filter = 'none'; // already baked into tempCanvas
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(tempCanvas, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  
  // ========== SAVE PHOTO ==========
  canvas.toBlob(async (blob) => {
    if (!blob) {
      showToast('❌ Failed to save');
      return;
    }
    const fileName = `IMG_${Date.now()}.jpg`;
    const file = new File([blob], fileName, { type: 'image/jpeg' });
    await saveMediaBlob(file, fileName, 'photo');
  }, 'image/jpeg', 0.92);
}

// ================================================================
// HELPERS
// ================================================================
function showToast(msg) {
  const el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function showLoading(msg) {
  document.getElementById('loadingText').textContent = msg || 'Loading...';
  document.getElementById('loadingOverlay').classList.add('active');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
}

// ================================================================
// INIT
// ================================================================
async function init() {
  await initDB();
  await refreshData();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('playerOverlay').classList.contains('active')) closePlayer();
    if (document.getElementById('cameraOverlay').classList.contains('active')) closeCamera();
  }
  if (e.key === ' ' || e.key === 'Space') {
    if (document.getElementById('playerOverlay').classList.contains('active')) {
      e.preventDefault();
      togglePlay();
    }
  }
});

init();
</script>
