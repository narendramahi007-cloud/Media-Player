<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mahi-Media_Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: #ffb6c1;
      min-height: 100vh;
      padding: 10px;
      overflow-y: auto;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 14px;
      min-height: 95vh;
    }
    
    h1 {
      text-align: center;
      color: #d81b60;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    
    .scan-section {
      background: rgba(255,255,255,0.5);
      padding: 10px;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    
    .btn {
      flex: 1;
      min-width: 70px;
      padding: 8px 10px;
      border: none;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
      color: white;
      text-align: center;
    }
    
    .btn:active { transform: scale(0.93); }
    .btn-folder { background: #2e7d32; }
    .btn-files { background: #d81b60; }
    .btn-camera { background: #1565c0; }
    .btn-all { background: #6a1b9a; }
    
    .status {
      text-align: center;
      padding: 6px;
      background: rgba(255,255,255,0.6);
      border-radius: 8px;
      margin: 6px 0;
      font-weight: 600;
      font-size: 0.75rem;
      color: #333;
    }
    
    .hidden-input { display: none; }
    
    .folder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    
    .folder-card {
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.6);
      border: 2px solid rgba(255,255,255,0.8);
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      font-weight: 600;
      font-size: 0.85rem;
    }
    
    .folder-card:active { background: #d81b60; color: white; transform: scale(0.95); }
    .folder-card .icon { font-size: 1.8rem; display: block; margin-bottom: 2px; }
    .folder-card .count { font-size: 0.6rem; opacity: 0.6; font-weight: 400; }
    
    .file-list {
      margin-top: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .file-item {
      background: rgba(255,255,255,0.5);
      padding: 8px 12px;
      margin: 3px 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.1s;
      font-size: 0.85rem;
    }
    
    .file-item:active { background: #d81b60; color: white; }
    .file-item .ficon { font-size: 1.2rem; }
    .file-item .fname { flex: 1; word-break: break-word; }
    .file-item .fmenu { font-size: 1.1rem; padding: 0 4px; cursor: pointer; }
    
    .back-btn {
      background: #d81b60;
      color: white;
      border: none;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 6px;
      font-size: 0.75rem;
    }
    
    .back-btn:active { transform: scale(0.95); }
    
    /* ========== PLAYER ========== */
    .player-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 999;
      display: none;
      flex-direction: column;
    }
    .player-overlay.active { display: flex; }
    
    .player-top {
      padding: 8px 12px;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      z-index: 10;
    }
    .player-top button {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .player-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }
    .player-content video, .player-content img, .player-content iframe {
      max-width: 100%;
      max-height: 100%;
    }
    .player-content iframe { width: 100%; height: 100%; border: none; background: white; }
    .player-controls {
      padding: 8px;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }
    .player-controls button {
      background: none;
      border: none;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .player-controls .play-btn { font-size: 2rem; color: #d81b60; }
    
    /* ========== CAMERA ========== */
    .camera-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .camera-overlay.active { display: flex; }
    
    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform-origin: center;
    }
    
    /* Zoom Control */
    .cam-zoom-control {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 15;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border-radius: 25px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .cam-zoom-control .z-label {
      color: white;
      font-size: 0.6rem;
      font-weight: 700;
    }
    .cam-zoom-control input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 3px;
      height: 80px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      outline: none;
      writing-mode: bt-lr;
    }
    .cam-zoom-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #d81b60;
      cursor: pointer;
    }
    
    /* Camera Controls */
    .camera-controls {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      padding: 0 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }
    .cam-shutter {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: white;
      border: 4px solid rgba(255,255,255,0.5);
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .cam-shutter:active { transform: scale(0.8); }
    .cam-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }
    .cam-btn:active { transform: scale(0.9); }
    .camera-flash {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.05s;
    }
    .camera-flash.active { opacity: 0.9; }
    
    /* Filter Row - Instagram Style */
    .filter-row {
      position: absolute;
      bottom: 100px;
      left: 0;
      width: 100%;
      padding: 4px 10px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      z-index: 10;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }
    .filter-row::-webkit-scrollbar { display: none; }
    
    .filter-item {
      flex: 0 0 55px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: 0.15s;
      padding: 3px;
      border-radius: 8px;
    }
    .filter-item:active { transform: scale(0.9); }
    .filter-item.active { background: rgba(216, 27, 96, 0.3); border-radius: 10px; }
    
    .filter-preview {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      background: #333;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    .filter-item.active .filter-preview {
      border-color: #d81b60;
      box-shadow: 0 0 12px rgba(216, 27, 96, 0.4);
    }
    .filter-name {
      font-size: 0.5rem;
      color: white;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    .filter-item.active .filter-name { color: #d81b60; }
    
    .toast-msg {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      opacity: 0;
      transition: 0.3s;
      z-index: 9999;
      pointer-events: none;
    }
    .toast-msg.show { opacity: 1; }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .loading-overlay.active { display: flex; }
    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #d81b60;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text { color: white; margin-top: 8px; font-size: 0.8rem; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container" id="app">
  <h1>📱 Mahi-Media_Pro</h1>
  
  <div class="scan-section">
    <div class="btn-group">
      <button class="btn btn-folder" onclick="selectFolder()">📁 Folder</button>
      <button class="btn btn-files" onclick="selectFiles()">📄 Files</button>
      <button class="btn btn-camera" onclick="openCamera()">📷 Camera</button>
      <button class="btn btn-all" onclick="showAllFiles()">📂 All</button>
    </div>
  </div>
  
  <div class="status" id="status">📂 Select folder or files</div>
  
  <input type="file" id="folderInput" class="hidden-input" webkitdirectory multiple onchange="handleFolderSelect(event)">
  <input type="file" id="fileInput" class="hidden-input" multiple accept="video/*,audio/*,image/*,.pdf" onchange="handleFileSelect(event)">
  
  <div id="folderView">
    <div class="folder-grid" id="folderGrid"></div>
  </div>
  
  <div id="fileView" style="display:none;">
    <button class="back-btn" onclick="showFolders()">⬅ Back</button>
    <div class="file-list" id="fileList"></div>
  </div>
</div>

<!-- Player -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-top">
    <span id="playerTitle" style="flex:1;font-weight:600;font-size:0.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">File</span>
    <button onclick="closePlayer()">✖</button>
  </div>
  <div class="player-content" id="playerContent">
    <video id="videoPlayer" playsinline></video>
    <img id="imagePlayer" src="">
    <iframe id="pdfPlayer"></iframe>
    <div id="audioPlayer" style="display:none;color:white;text-align:center;padding:20px;">
      <div style="font-size:3.5rem;">🎵</div>
      <div style="margin-top:8px;font-size:0.85rem;font-weight:600;" id="audioName"></div>
      <audio id="audioElem" controls style="width:90%;max-width:300px;margin-top:12px;"></audio>
    </div>
  </div>
  <div class="player-controls">
    <button onclick="prevFile()">⏮</button>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">⏸</button>
    <button onclick="nextFile()">⏭</button>
  </div>
</div>

<!-- Camera -->
<div class="camera-overlay" id="cameraOverlay">
  <video id="camera-video" autoplay playsinline></video>
  <div class="camera-flash" id="cameraFlash"></div>
  
  <div class="cam-zoom-control">
    <span class="z-label" id="zoomLabel">1.0x</span>
    <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" oninput="updateZoom(this.value)">
  </div>
  
  <div class="filter-row" id="filterRow"></div>
  
  <div class="camera-controls">
    <button class="cam-btn" onclick="closeCamera()">✖</button>
    <div class="cam-shutter" onclick="takePhoto()"></div>
    <button class="cam-btn" onclick="switchCamera()">🔄</button>
  </div>
</div>

<div class="toast-msg" id="toastMsg"></div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Loading...</div>
</div>

<script>
// ================================================================
// DATABASE
// ================================================================
const DB_NAME = "MahiMediaDB";
let db = null;

function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("media")) {
        db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
  });
}

function saveFiles(files, source) {
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readwrite");
    const store = tx.objectStore("media");
    files.forEach(f => {
      const ext = f.name.split('.').pop().toLowerCase();
      let type = 'unknown';
      if (f.type.startsWith('video/') || ['mp4','mkv','webm','avi','mov','3gp'].includes(ext)) type = 'video';
      else if (f.type.startsWith('image/') || ['jpg','jpeg','png','gif','webp','bmp'].includes(ext)) type = 'image';
      else if (f.type.startsWith('audio/') || ['mp3','wav','m4a','aac','ogg'].includes(ext)) type = 'audio';
      else if (f.type === 'application/pdf' || ext === 'pdf') type = 'pdf';
      if (type !== 'unknown') {
        let folder = 'Main';
        if (source === 'folder' && f.webkitRelativePath) {
          const parts = f.webkitRelativePath.split('/');
          if (parts.length > 1) folder = parts[parts.length - 2];
        } else if (source === 'camera') {
          folder = '📸 Camera';
        } else {
          folder = '📁 Selected';
        }
        store.add({ name: f.name, type: type, folder: folder, blob: f });
      }
    });
    tx.oncomplete = () => resolve();
  });
}

function loadAllFiles() {
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readonly");
    const req = tx.objectStore("media").getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

function deleteFile(id) {
  return new Promise((resolve) => {
    const tx = db.transaction("media", "readwrite");
    tx.objectStore("media").delete(id);
    tx.oncomplete = () => resolve();
  });
}

// ================================================================
// APP STATE
// ================================================================
let allFiles = [];
let currentFolder = '';
let currentPlaylist = [];
let currentIndex = 0;
let currentPlayer = null;

// ================================================================
// FILE SELECTION
// ================================================================
function selectFolder() { document.getElementById('folderInput').click(); }
function selectFiles() { document.getElementById('fileInput').click(); }

async function handleFolderSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  showLoading('📁 Processing...');
  await saveFiles(files, 'folder');
  await refreshData();
  hideLoading();
  showToast(`✅ ${files.length} files loaded!`);
  e.target.value = '';
}

async function handleFileSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  showLoading('📄 Processing...');
  await saveFiles(files, 'files');
  await refreshData();
  hideLoading();
  showToast(`✅ ${files.length} files loaded!`);
  e.target.value = '';
}

// ================================================================
// UI
// ================================================================
async function refreshData() {
  allFiles = await loadAllFiles();
  document.getElementById('status').innerHTML = `📂 ${allFiles.length} files total`;
  showFolders();
}

function showFolders() {
  document.getElementById('folderView').style.display = 'block';
  document.getElementById('fileView').style.display = 'none';
  const grid = document.getElementById('folderGrid');
  grid.innerHTML = '';
  const folders = {};
  allFiles.forEach(f => { if (!folders[f.folder]) folders[f.folder] = []; folders[f.folder].push(f); });
  const iconMap = { video:'🎬', audio:'🎵', image:'🖼️', pdf:'📄' };
  Object.keys(folders).forEach(folder => {
    const files = folders[folder];
    const counts = { video:0, audio:0, image:0, pdf:0 };
    files.forEach(f => { if (counts[f.type] !== undefined) counts[f.type]++; });
    const summary = Object.keys(counts).filter(k => counts[k] > 0).map(k => `${iconMap[k]}${counts[k]}`).join(' ');
    const card = document.createElement('div');
    card.className = 'folder-card';
    card.innerHTML = `<span class="icon">📂</span>${folder}<div class="count">${files.length} files ${summary}</div>`;
    card.onclick = () => openFolder(folder);
    grid.appendChild(card);
  });
  if (Object.keys(folders).length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#666;padding:20px;">No files. Select a folder or files above.</p>';
  }
}

function openFolder(folder) {
  currentFolder = folder;
  currentPlaylist = allFiles.filter(f => f.folder === folder);
  document.getElementById('folderView').style.display = 'none';
  document.getElementById('fileView').style.display = 'block';
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  const iconMap = { video:'🎬', audio:'🎵', image:'🖼️', pdf:'📄' };
  currentPlaylist.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'file-item';
    const globalIdx = allFiles.indexOf(item);
    div.innerHTML = `
      <span class="ficon">${iconMap[item.type] || '📄'}</span>
      <span class="fname">${item.name}</span>
      <span class="fmenu" onclick="event.stopPropagation();showFileMenu(${item.id}, '${item.name}')">⋮</span>
    `;
    div.onclick = () => playFile(globalIdx);
    list.appendChild(div);
  });
}

function showAllFiles() {
  currentFolder = 'All Files';
  currentPlaylist = allFiles;
  document.getElementById('folderView').style.display = 'none';
  document.getElementById('fileView').style.display = 'block';
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  const iconMap = { video:'🎬', audio:'🎵', image:'🖼️', pdf:'📄' };
  currentPlaylist.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'file-item';
    const globalIdx = allFiles.indexOf(item);
    div.innerHTML = `
      <span class="ficon">${iconMap[item.type] || '📄'}</span>
      <span class="fname">${item.name}</span>
      <span style="font-size:0.6rem;opacity:0.5;">${item.folder}</span>
      <span class="fmenu" onclick="event.stopPropagation();showFileMenu(${item.id}, '${item.name}')">⋮</span>
    `;
    div.onclick = () => playFile(globalIdx);
    list.appendChild(div);
  });
}

function showFileMenu(id, name) {
  const action = prompt(`Rename or type 'delete':\n${name}`, name);
  if (action === null) return;
  if (action.toLowerCase().trim() === 'delete') {
    if (confirm('Delete this file?')) {
      deleteFile(id).then(refreshData);
      showToast('🗑️ Deleted');
    }
  } else if (action.trim() && action.trim() !== name) {
    const tx = db.transaction("media", "readwrite");
    const store = tx.objectStore("media");
    const req = store.get(id);
    req.onsuccess = () => {
      const data = req.result;
      data.name = action.trim();
      store.put(data);
      tx.oncomplete = () => { refreshData(); showToast('✏️ Renamed'); };
    };
  }
}

// ================================================================
// PLAYER
// ================================================================
function playFile(index) {
  currentIndex = index;
  const item = allFiles[index];
  if (!item) return;
  const overlay = document.getElementById('playerOverlay');
  document.getElementById('playerTitle').textContent = item.name;
  const video = document.getElementById('videoPlayer');
  const image = document.getElementById('imagePlayer');
  const pdf = document.getElementById('pdfPlayer');
  const audio = document.getElementById('audioPlayer');
  const audioElem = document.getElementById('audioElem');
  const audioName = document.getElementById('audioName');
  video.style.display = 'none';
  image.style.display = 'none';
  pdf.style.display = 'none';
  audio.style.display = 'none';
  video.pause();
  audioElem.pause();
  const url = URL.createObjectURL(item.blob);
  if (item.type === 'video') {
    video.style.display = 'block';
    video.src = url;
    video.play();
    currentPlayer = video;
  } else if (item.type === 'image') {
    image.style.display = 'block';
    image.src = url;
    currentPlayer = null;
  } else if (item.type === 'pdf') {
    pdf.style.display = 'block';
    pdf.src = url;
    currentPlayer = null;
  } else if (item.type === 'audio') {
    audio.style.display = 'block';
    audioName.textContent = item.name;
    audioElem.src = url;
    audioElem.play();
    currentPlayer = audioElem;
  }
  overlay.classList.add('active');
}

function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('active');
  document.getElementById('videoPlayer').pause();
  document.getElementById('videoPlayer').src = '';
  document.getElementById('imagePlayer').src = '';
  document.getElementById('pdfPlayer').src = '';
  document.getElementById('audioElem').pause();
  document.getElementById('audioElem').src = '';
}

function togglePlay() {
  if (!currentPlayer) return;
  const btn = document.getElementById('playBtn');
  if (currentPlayer.paused) {
    currentPlayer.play();
    btn.textContent = '⏸';
  } else {
    currentPlayer.pause();
    btn.textContent = '▶';
  }
}

function nextFile() {
  const idx = currentPlaylist.indexOf(allFiles[currentIndex]);
  if (idx < currentPlaylist.length - 1) {
    const newIdx = allFiles.indexOf(currentPlaylist[idx + 1]);
    playFile(newIdx);
  }
}

function prevFile() {
  const idx = currentPlaylist.indexOf(allFiles[currentIndex]);
  if (idx > 0) {
    const newIdx = allFiles.indexOf(currentPlaylist[idx - 1]);
    playFile(newIdx);
  }
}

document.addEventListener('ended', () => {
  if (document.getElementById('playerOverlay').classList.contains('active')) nextFile();
});

// ================================================================
// CAMERA WITH REAL FILTERS (LIVE PREVIEW + PHOTO)
// ================================================================
let cameraStream = null;
let facingMode = 'environment';
let currentFilter = 'clarendon';
let cameraZoom = 1;

// ========== REAL FILTERS - Instagram/Reels Style ==========
// Each filter has: name, preview color, and apply function
const FILTERS = {
  normal: {
    name: 'Normal',
    preview: '#888',
    apply: (d) => d
  },
  clarendon: {
    name: 'Clarendon',
    preview: '#f4a460',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * 1.18 + 12);
        d[i+1] = Math.min(255, d[i+1] * 1.10 + 10);
        d[i+2] = Math.min(255, d[i+2] * 1.06 + 6);
      }
      return d;
    }
  },
  summer: {
    name: 'Summer',
    preview: '#f7dc6f',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] + 30);
        d[i+1] = Math.min(255, d[i+1] + 15);
        d[i+2] = Math.min(255, d[i+2] - 10);
        // Contrast
        d[i] = Math.min(255, Math.max(0, (d[i] - 128) * 1.15 + 128));
        d[i+1] = Math.min(255, Math.max(0, (d[i+1] - 128) * 1.10 + 128));
        d[i+2] = Math.min(255, Math.max(0, (d[i+2] - 128) * 0.90 + 128));
      }
      return d;
    }
  },
  vibrant: {
    name: 'Vibrant',
    preview: '#e74c3c',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
        const sat = 1.6;
        d[i] = Math.min(255, gray + sat * (r - gray));
        d[i+1] = Math.min(255, gray + sat * (g - gray));
        d[i+2] = Math.min(255, gray + sat * (b - gray));
        // Contrast
        d[i] = Math.min(255, Math.max(0, (d[i] - 128) * 1.12 + 128));
        d[i+1] = Math.min(255, Math.max(0, (d[i+1] - 128) * 1.12 + 128));
        d[i+2] = Math.min(255, Math.max(0, (d[i+2] - 128) * 1.12 + 128));
      }
      return d;
    }
  },
  cool: {
    name: 'Cool',
    preview: '#5dade2',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] - 12);
        d[i+1] = Math.min(255, d[i+1] + 6);
        d[i+2] = Math.min(255, d[i+2] + 22);
      }
      return d;
    }
  },
  apple: {
    name: 'Apple',
    preview: '#aed6f1',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * 1.04 + 4);
        d[i+1] = Math.min(255, d[i+1] * 1.06 + 6);
        d[i+2] = Math.min(255, d[i+2] * 1.02 + 4);
        // Soft contrast
        d[i] = Math.min(255, Math.max(0, (d[i] - 128) * 1.06 + 128));
        d[i+1] = Math.min(255, Math.max(0, (d[i+1] - 128) * 1.06 + 128));
        d[i+2] = Math.min(255, Math.max(0, (d[i+2] - 128) * 1.04 + 128));
      }
      return d;
    }
  },
  cinematic: {
    name: 'Cinematic',
    preview: '#2c3e50',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        // High contrast + slight desaturation + warm tint
        const r = d[i], g = d[i+1], b = d[i+2];
        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
        const sat = 0.7;
        d[i] = Math.min(255, Math.max(0, (gray + sat * (r - gray)) * 1.2 - 10));
        d[i+1] = Math.min(255, Math.max(0, (gray + sat * (g - gray)) * 1.15 - 8));
        d[i+2] = Math.min(255, Math.max(0, (gray + sat * (b - gray)) * 1.05 - 5));
        // Warm tint
        d[i] = Math.min(255, d[i] + 8);
        d[i+1] = Math.min(255, d[i+1] + 4);
        d[i+2] = Math.min(255, d[i+2] - 6);
      }
      return d;
    }
  },
  gingham: {
    name: 'Gingham',
    preview: '#d4a5a5',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * 0.92 + 18);
        d[i+1] = Math.min(255, d[i+1] * 0.88 + 14);
        d[i+2] = Math.min(255, d[i+2] * 0.85 + 10);
      }
      return d;
    }
  },
  moon: {
    name: 'Moon',
    preview: '#95a5a6',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const val = Math.min(255, Math.max(0, (gray - 128) * 1.4 + 128));
        d[i] = val;
        d[i+1] = val;
        d[i+2] = val;
      }
      return d;
    }
  },
  lark: {
    name: 'Lark',
    preview: '#c9b99a',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * 1.12 + 6);
        d[i+1] = Math.min(255, d[i+1] * 1.06 + 8);
        d[i+2] = Math.min(255, d[i+2] * 0.92 + 12);
      }
      return d;
    }
  },
  reyes: {
    name: 'Reyes',
    preview: '#b8a090',
    apply: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * 0.82 + 32);
        d[i+1] = Math.min(255, d[i+1] * 0.78 + 28);
        d[i+2] = Math.min(255, d[i+2] * 0.74 + 24);
      }
      return d;
    }
  }
};

// ========== CAMERA UI ==========
function initCameraUI() {
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  
  Object.keys(FILTERS).forEach(key => {
    const item = document.createElement('div');
    item.className = `filter-item ${key === currentFilter ? 'active' : ''}`;
    
    const preview = document.createElement('div');
    preview.className = 'filter-preview';
    preview.style.background = FILTERS[key].preview;
    
    const name = document.createElement('span');
    name.className = 'filter-name';
    name.textContent = FILTERS[key].name;
    
    item.appendChild(preview);
    item.appendChild(name);
    
    item.onclick = () => {
      currentFilter = key;
      document.querySelectorAll('.filter-item').forEach(c => c.classList.remove('active'));
      item.classList.add('active');
      showToast(`📸 ${FILTERS[key].name}`);
    };
    row.appendChild(item);
  });
}

async function openCamera() {
  document.getElementById('cameraOverlay').classList.add('active');
  initCameraUI();
  document.getElementById('zoomSlider').value = 1;
  document.getElementById('zoomLabel').textContent = '1.0x';
  cameraZoom = 1;
  
  try {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
    }
    const constraints = {
      video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    };
    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('camera-video').srcObject = cameraStream;
    await document.getElementById('camera-video').play();
    showToast('📷 Camera ready');
  } catch (err) {
    alert('❌ Camera access denied!\nPlease allow camera permission.');
    closeCamera();
  }
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  document.getElementById('cameraOverlay').classList.remove('active');
}

function switchCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  openCamera();
}

function updateZoom(val) {
  cameraZoom = parseFloat(val);
  document.getElementById('zoomLabel').textContent = cameraZoom.toFixed(1) + 'x';
  const video = document.getElementById('camera-video');
  if (facingMode === 'user') {
    video.style.transform = `scaleX(-1) scale(${cameraZoom})`;
  } else {
    video.style.transform = `scale(${cameraZoom})`;
  }
}

// ========== TAKE PHOTO WITH REAL FILTER + SAVE ==========
function takePhoto() {
  // Flash effect
  const flash = document.getElementById('cameraFlash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 200);
  
  const video = document.getElementById('camera-video');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  const w = video.videoWidth || 1280;
  const h = video.videoHeight || 720;
  canvas.width = w;
  canvas.height = h;
  
  // Apply zoom
  const zoom = cameraZoom;
  const sw = w / zoom;
  const sh = h / zoom;
  const sx = (w - sw) / 2;
  const sy = (h - sh) / 2;
  
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  
  // ========== APPLY FILTER (PIXEL MANIPULATION) ==========
  const imageData = ctx.getImageData(0, 0, w, h);
  const filterFn = FILTERS[currentFilter]?.apply || FILTERS.normal.apply;
  filterFn(imageData.data);
  ctx.putImageData(imageData, 0, 0);
  
  // Mirror for front camera
  if (facingMode === 'user') {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w;
    tempCanvas.height = h;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(canvas, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(tempCanvas, 0, 0);
  }
  
  // ========== SAVE PHOTO ==========
  canvas.toBlob(async (blob) => {
    if (!blob) {
      showToast('❌ Failed to save');
      return;
    }
    
    const fileName = `IMG_${Date.now()}.jpg`;
    const file = new File([blob], fileName, { type: 'image/jpeg' });
    
    // 1. Save to IndexedDB
    await saveFiles([file], 'camera');
    await refreshData();
    
    // 2. Download to device (DCIM folder in Android)
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    showToast('✅ Photo saved to Gallery!');
  }, 'image/jpeg', 0.92);
}

// ================================================================
// HELPERS
// ================================================================
function showToast(msg) {
  const el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function showLoading(msg) {
  document.getElementById('loadingText').textContent = msg || 'Loading...';
  document.getElementById('loadingOverlay').classList.add('active');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
}

// ================================================================
// INIT
// ================================================================
async function init() {
  await initDB();
  await refreshData();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('playerOverlay').classList.contains('active')) closePlayer();
    if (document.getElementById('cameraOverlay').classList.contains('active')) closeCamera();
  }
  if (e.key === ' ' || e.key === 'Space') {
    if (document.getElementById('playerOverlay').classList.contains('active')) {
      e.preventDefault();
      togglePlay();
    }
  }
});

init();
